name: Build Android arm64 Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      fetch_cc0_assets:
        description: "Fetch CC0 KayKit/Kenney packs before export"
        required: false
        default: "false"
        type: boolean

env:
  GODOT_VERSION: "4.7-stable"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build-android-apk:
    name: Export Reduced-Town (arm64 Debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-${{ env.ANDROID_API_LEVEL }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Generate debug keystore for APK signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache Godot 4.7 binary and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot-cache
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          mkdir -p /tmp/godot-cache "$HOME/.local/share/godot/export_templates"
          GODOT_BIN="/tmp/godot-cache/Godot_v${GODOT_VERSION}_linux.x86_64"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION//-/.}"

          if [ ! -x "$GODOT_BIN" ]; then
            curl -fSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -q -o /tmp/godot.zip -d /tmp/godot-cache
            chmod +x "$GODOT_BIN"
            rm -f /tmp/godot.zip
          fi

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            curl -fSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p /tmp/templates-extract
            unzip -q -o /tmp/templates.tpz -d /tmp/templates-extract
            mkdir -p "$TEMPLATE_DIR"
            cp -r /tmp/templates-extract/templates/* "$TEMPLATE_DIR/"
            rm -rf /tmp/templates.tpz /tmp/templates-extract
          fi

          ln -sf "$GODOT_BIN" /usr/local/bin/godot

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Optional — Fetch CC0 Asset Packs
        if: ${{ inputs.fetch_cc0_assets == true }}
        run: |
          chmod +x tools/fetch_cc0_assets.sh
          ./tools/fetch_cc0_assets.sh || echo "CC0 fetch partially unavailable; bundled PBR GLB assets remain active."

      - name: Prepare export_presets.cfg from template
        run: |
          cp export_presets.cfg.template export_presets.cfg
          mkdir -p build/android

      - name: Import Godot project resources (headless)
        run: |
          godot --headless --path . --import

      - name: Export arm64 Debug APK
        run: |
          godot --headless --path . --export-debug "Android" build/android/reduced-town-arm64-debug.apk
          ls -lh build/android/reduced-town-arm64-debug.apk

      - name: Upload arm64 Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reduced-town-stage1-arm64-debug-apk
          path: build/android/reduced-town-arm64-debug.apk
          retention-days: 30
